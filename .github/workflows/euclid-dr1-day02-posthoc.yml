name: Validate Euclid DR1-F Day 02 post-hoc diagnostic
on:
  push:
    branches: [research/euclid-dr1-foundation-day01-20261114]
    paths:
      - '.github/workflows/euclid-dr1-day02-posthoc.yml'
      - 'euclid-dr1-foundation/2026-11-15-day02/analysis/scripts/posthoc_quality_controls.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/euclid-dr1-foundation-day01-20261114
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy scipy statsmodels matplotlib
      - name: Reproduce post-hoc sensitivity on committed real DR1-F source tables
        run: python euclid-dr1-foundation/2026-11-15-day02/analysis/scripts/posthoc_quality_controls.py
      - name: Verify numerical results within rounding
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("euclid-dr1-foundation/2026-11-15-day02/analysis/observed_results/posthoc/posthoc_metrics.json")
          r=json.loads(p.read_text())
          assert r["quality"]["n_clean"]==782
          assert r["quality"]["n_matched"]==1576
          assert abs(r["hc3_regression"]["ha_slope_dex_per_dex"]-0.1242796)<1e-4
          assert r["analysis_type"].startswith("post-hoc")
          print("Validated real-data regression and sample sizes")
          PY
      - name: Archive reproducible supplementary checks under researcher identity
        run: |
          git config user.name "Biswajit Jana"
          git config user.email "49089568+Biswajit1999@users.noreply.github.com"
          git add euclid-dr1-foundation/2026-11-15-day02/analysis/observed_results/posthoc/
          if ! git diff --cached --quiet; then
            git commit -m "Record post-hoc DR1-F galaxy-aperture regression and flag sensitivity"
            bash .github/scripts/push-euclid-archive.sh
          else
            echo "Supplementary outputs unchanged"
          fi
