name: Euclid DR1-F real image and spectrum inventory
on:
  push:
    branches: [research/euclid-dr1-foundation-day01-20261114]
    paths:
      - '.github/workflows/euclid-dr1-media-inventory.yml'
      - 'euclid-dr1-foundation/2026-11-14-day01/analysis/scripts/inventory_real_media.py'
permissions: { contents: read }
jobs:
  inspect-media:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install boto3
      - run: python euclid-dr1-foundation/2026-11-14-day01/analysis/scripts/inventory_real_media.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dr1-day01-real-media-inventory
          path: euclid-dr1-foundation/2026-11-14-day01/analysis/pilot_real/real_media_inventory.json
