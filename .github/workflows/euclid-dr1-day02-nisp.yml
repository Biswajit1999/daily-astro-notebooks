name: Inspect object-matched real Euclid DR1-F NISP spectra
on:
  push:
    branches: [research/euclid-dr1-foundation-day01-20261114]
    paths:
      - '.github/workflows/euclid-dr1-day02-nisp.yml'
      - 'euclid-dr1-foundation/2026-11-15-day02/analysis/scripts/inspect_matched_nisp.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/euclid-dr1-foundation-day01-20261114
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 astropy pandas numpy matplotlib
      - name: Cross-identify NISP SIR meta HDUs to clean Halpha sample
        run: python euclid-dr1-foundation/2026-11-15-day02/analysis/scripts/inspect_matched_nisp.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: euclid-dr1-day02-matched-spectra
          path: euclid-dr1-foundation/2026-11-15-day02/analysis/observed_results/matched_spectra/
          if-no-files-found: warn
      - name: Archive audited 1D spectra and object mapping
        run: |
          git config user.name "Biswajit Jana"
          git config user.email "49089568+Biswajit1999@users.noreply.github.com"
          git add euclid-dr1-foundation/2026-11-15-day02/analysis/observed_results/matched_spectra/
          if ! git diff --cached --quiet; then
            git commit -m "Archive object-matched DR1-F NISP spectra and line-window diagnostics"
            bash .github/scripts/push-euclid-archive.sh
          fi
